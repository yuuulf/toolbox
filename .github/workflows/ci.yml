name: CI

on:
  pull_request:
  # 手動で再実行するため。dispatch の実行は PR のチェックに数えられず、main の必須チェック（verify）は満たさない
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR（dispatch ではブランチ）に新しいコミットが積まれたら、古い実行は取り消す
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify
