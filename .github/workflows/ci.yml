name: CI

on:
  pull_request:

permissions:
  contents: read

# 同じ PR に新しいコミットが積まれたら、古い実行は取り消す
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify
